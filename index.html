<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Randomizer Tracker</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e0e0e0;
      --accent: #4da6ff;
      --border: #333;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 20px;
    }

    h2 { margin-top: 0; }

    /* Inventory Section */
    .inventory {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .item {
      padding: 10px 16px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .item.active {
      border-color: var(--accent);
      background: #1a2a3a;
      font-weight: bold;
    }

    /* 8-Table Grid Layout */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .region-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }

    tr.check-row {
      cursor: pointer;
    }

    tr.check-row:hover {
      background: #2a2a2a;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

// 2. Automatically assign unique slug IDs
const masterChecks = rawMasterChecks.map(check => ({
  ...check,
  id: slugify(check.name) // Results in "acorn-barnacle", "scallop", "sea-anemone"
}));

// Definition for the 8 region tables
const regions = [
  { name: "January - 12PM", month: "January", hour: "Noon" },
  { name: "January - 12AM", month: "January", hour: "Midnight" },
  { name: "April - 12PM",   month: "April",   hour: "Noon" },
  { name: "April - 12AM",   month: "April",   hour: "Midnight" },
  { name: "August - 12PM",  month: "August",  hour: "Noon" },
  { name: "August - 12AM",  month: "August",  hour: "Midnight" },
  { name: "October - 12PM", month: "October", hour: "Noon" },
  { name: "October - 12AM", month: "October", hour: "Midnight" }
];

    // 2. Logic Checker
    function isCheckAvailable(items, months, hours) {
      console.log(itemsState)
      return Array.isArray(items) && items.every(item => itemsState[item]) &&
         Array.isArray(months) && months.some(month => itemsState[month]) &&
         Array.isArray(hours) && hours.some(hour => itemsState[hour]);
    }

    function toggleItem(itemKey, el) {
  itemsState[itemKey] = !itemsState[itemKey];
  el.classList.toggle("active");
  renderTables(); // Re-renders and automatically hides empty headers/tables
}

function completeCheck(checkId) {
  completedChecks.add(checkId);
  renderTables(); // Instantly removes checked item and cleans up empty headers
}

    function renderTables() {
  const container = document.getElementById("tables-container");
  container.innerHTML = "";

  regions.forEach(region => {
    const card = document.createElement("div");
    card.className = "region-card";

    // 1. Get all checks belonging to this region's month AND hour
    const regionChecks = masterChecks.filter(check => 
      check.months.includes(region.month) && check.hours.includes(region.hour)
    );

    // 2. Find unique items required in this region
    const uniqueItems = [...new Set(regionChecks.flatMap(check => check.items || []))];

    let cardHTML = `<h2>${region.name}</h2>`;
    let visibleTablesCount = 0;

    // 3. Loop through each item group
    uniqueItems.forEach(itemName => {
      // Filter for checks that need this item AND pass isCheckAvailable & not completed
      const availableItemChecks = regionChecks.filter(check => {
        const requiresItem = check.items.includes(itemName);
        const isAvailable = isCheckAvailable(check.items, check.months, check.hours);
        const isCompleted = completedChecks.has(check.id);
        
        return requiresItem && isAvailable && !isCompleted;
      });

      // ONLY build and append the table if there is at least one available check!
      if (availableItemChecks.length > 0) {
        visibleTablesCount++;
        cardHTML += `
          <h3>${getDisplayName(itemName)}</h3>
          <table>
            <tbody>`;
        
        availableItemChecks.forEach(check => {
          cardHTML += `
            <tr class="check-row" data-id="${check.id}" onclick="completeCheck('${check.id}')">
              <td>${check.name}</td>
            </tr>`;
        });

        cardHTML += `</tbody></table><br>`;
      }
    });

    // Optional: Hide the entire region card if all item tables inside it are empty
    if (visibleTablesCount === 0) {
      card.classList.add("hidden");
    }

    card.innerHTML = cardHTML;
    container.appendChild(card);
  });

  // Highlight active items in the inventory bar
  const inventoryItems = document.querySelectorAll("#inventory .item");
  inventoryItems.forEach(el => {
    if (itemsState[el.id]) {
      el.classList.add("active");
    } else {
      el.classList.remove("active");
    }
  });
}

    function updateVisibility() {
  masterChecks.forEach(check => {
    const rows = document.querySelectorAll(`tr[data-id="${check.id}"]`);
    const available = isCheckAvailable(check.items, check.months, check.hours);
    const completed = completedChecks.has(check.id);

    rows.forEach(row => {
      if (!completed && available) {
        row.classList.remove("hidden");
      } else {
        row.classList.add("hidden");
      }
    });
  });
}

    // Initialize
    renderTables();
    updateVisibility();
  </script>
